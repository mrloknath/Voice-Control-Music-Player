plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giriloknath4.musicplayer'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.giriloknath4.musicplayer"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //recycler view animator
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    //exoplayer
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    // ExoPlayer MediaSession Extension (REQUIRED)
    implementation 'com.google.android.exoplayer:extension-mediasession:2.19.1'
    //circle image
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    // for palettes for extracting color
    implementation 'androidx.palette:palette:1.0.0'
    // blurImageview
    implementation 'com.github.jgabrielfreitas:BlurImageView:1.0.1'
    // Offline speech recognition and KWS by Vosk
    implementation 'com.alphacephei:vosk-android:0.3.47'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}